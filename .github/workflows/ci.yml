name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check src scripts tests
      - name: Compile
        run: python -m compileall src scripts tests
      - name: Test
        run: pytest -v --junitxml=pytest-report.xml
      - name: Verify promoted model integrity
        run: cd artifacts/release && sha256sum --check SHA256SUMS
      - name: Docker build
        run: |
          docker build \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -t cats-dogs-mlops-api:${{ github.sha }} .
      - name: Run container
        run: docker run --detach --name cats-dogs-ci --publish 8000:8000 cats-dogs-mlops-api:${{ github.sha }}
      - name: Container smoke test
        run: python scripts/smoke_test.py --base-url http://localhost:8000 --retries 30 --delay 2
      - name: Container diagnostics on failure
        if: failure()
        run: |
          if docker container inspect cats-dogs-ci >/dev/null 2>&1; then
            docker logs cats-dogs-ci
          else
            echo "::warning::The test container was not created. Inspect the first failed step above."
            docker image ls --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}'
          fi
      - name: Stop test container
        if: always()
        run: docker rm --force cats-dogs-ci || true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.sha }}
          path: pytest-report.xml

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify promoted model integrity
        run: cd artifacts/release && sha256sum --check SHA256SUMS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
